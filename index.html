<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="header">
      <h1>Calculadora</h1>
      <p>
        Desenvolvido por
        <a href="https://github.com/starfingar/" target="_blank">starfingar</a>
      </p>
    </div>

    <div class="container">
      <div class="display">0</div>
      
      <div class="columns">
        <button>C</button>
        <button>%</button>
        <button>X</button>
        <button>+</button>
      </div>
      <div class="columns">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>-</button>
      </div>
      <div class="columns">
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>×</button>
      </div>
      <div class="columns">
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>÷</button>
      </div>
      <div class="columns">
        <button>.</button>
        <button>0</button>
        <button>=</button>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
